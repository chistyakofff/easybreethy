<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#2E7BE0" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b1420" />
    <meta name="description" content="EasyBreethy — дыхательные упражнения, которые помогают справиться с тревогой и паническими атаками." />
    <title>EasyBreethy — дыхательные упражнения от паники</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('easybreethy-theme');
          if (theme === 'light' || theme === 'dark') {
            document.documentElement.setAttribute('data-theme', theme);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
